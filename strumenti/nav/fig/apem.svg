<svg viewBox="0 0 700 396" role="img" aria-label="Le quattro fasi del passage plan" xmlns="http://www.w3.org/2000/svg">
<rect x="40" y="40" width="280" height="130" rx="12" style="fill:color-mix(in srgb,var(--blue) 8%,var(--sheet));stroke:var(--blue);stroke-width:2"/>
<text class="sm tb" x="58" y="70" text-anchor="start">1 · VALUTAZIONE</text>
<text class="xs" x="302" y="70" text-anchor="end">Appraisal</text>
<text class="xs" x="58" y="102" text-anchor="start">• carte e pubblicazioni aggiornate</text>
<text class="xs" x="58" y="124" text-anchor="start">• maree, correnti, meteo</text>
<text class="xs" x="58" y="146" text-anchor="start">• pescaggio e condizioni nave</text>
<rect x="380" y="40" width="280" height="130" rx="12" style="fill:color-mix(in srgb,var(--blue) 8%,var(--sheet));stroke:var(--blue);stroke-width:2"/>
<text class="sm tb" x="398" y="70" text-anchor="start">2 · PIANIFICAZIONE</text>
<text class="xs" x="642" y="70" text-anchor="end">Planning</text>
<text class="xs" x="398" y="102" text-anchor="start">• rotta, waypoint, WOP</text>
<text class="xs" x="398" y="124" text-anchor="start">• no-go area, margini, UKC</text>
<text class="xs" x="398" y="146" text-anchor="start">• abort point, ancoraggi</text>
<rect x="380" y="230" width="280" height="130" rx="12" style="fill:color-mix(in srgb,var(--green) 8%,var(--sheet));stroke:var(--green);stroke-width:2"/>
<text class="sm tg" x="398" y="260" text-anchor="start">3 · ESECUZIONE</text>
<text class="xs" x="642" y="260" text-anchor="end">Execution</text>
<text class="xs" x="398" y="292" text-anchor="start">• approvazione del comandante</text>
<text class="xs" x="398" y="314" text-anchor="start">• ETA, briefing della guardia</text>
<text class="xs" x="398" y="336" text-anchor="start">• quando chiamare il comandante</text>
<rect x="40" y="230" width="280" height="130" rx="12" style="fill:color-mix(in srgb,var(--green) 8%,var(--sheet));stroke:var(--green);stroke-width:2"/>
<text class="sm tg" x="58" y="260" text-anchor="start">4 · MONITORAGGIO</text>
<text class="xs" x="302" y="260" text-anchor="end">Monitoring</text>
<text class="xs" x="58" y="292" text-anchor="start">• punto nave con 2 metodi</text>
<text class="xs" x="58" y="314" text-anchor="start">• controllo XTE e allarmi</text>
<text class="xs" x="58" y="336" text-anchor="start">• registrazione sul giornale</text>
