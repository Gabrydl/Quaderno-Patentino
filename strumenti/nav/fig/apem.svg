<path d="M374.0,295.0L338.0,295.0" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"/><path d="M328.0,295.0L338.0,290.5L338.0,299.5Z" style="fill:currentColor;stroke:none"/>
<path d="M180.0,224.0L180.0,188.0" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"/><path d="M180.0,178.0L184.5,188.0L175.5,188.0Z" style="fill:currentColor;stroke:none"/>
<text class="xs" x="350" y="382" text-anchor="middle">da banchina a banchina (berth to berth) · SOLAS V/34 · IMO A.893(21)</text>
<text class="xs tb" x="350" y="186" text-anchor="middle">PREPARAZIONE</text>
<text class="xs tg" x="350" y="222" text-anchor="middle">IN NAVIGAZIONE</text>
</svg>